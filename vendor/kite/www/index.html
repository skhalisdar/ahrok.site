<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Kite</title><style>
*{box-sizing:border-box}
body{margin:0;background:#f8fafc;color:#17213a;font:15px/1.5 system-ui,sans-serif}
main{max-width:1140px;margin:auto;padding:clamp(14px,4vw,42px)}
h1,h2,p{margin:0} h1{font-size:clamp(29px,5vw,46px);line-height:1.1;letter-spacing:-.045em;font-weight:800} h2{font-size:22px;font-weight:750}
small,.muted{color:#536078} button,input,select,textarea{font:inherit;color:inherit} textarea{min-width:220px;min-height:90px;max-width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:10px} .entry p{white-space:pre-wrap;overflow-wrap:anywhere}
button,input,select{min-height:44px;border:1px solid #cbd5e1;border-radius:10px;background:white;padding:8px 12px}
button{cursor:pointer;font-weight:650} button:hover:not(:disabled){border-color:#0ea5e9} button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid #075985;outline-offset:2px}
.hero{background:#0f172a;color:white;border-radius:22px;padding:clamp(20px,4vw,36px);display:flex;justify-content:space-between;align-items:end;gap:22px;flex-wrap:wrap}
.hero p{color:#e0f2fe;margin-top:10px}.hero input{color:#17213a;width:100%;min-width:155px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;display:block;margin-bottom:8px}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0}
.card{background:white;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 2px 4px #17213a08;min-width:0}
.metric{padding:clamp(9px,2vw,18px)} .metric strong{display:block;font-size:clamp(18px,3vw,27px);line-height:1.2;color:#075985}
.toolbar,.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.toolbar{margin:20px 0}.tabs{display:flex;gap:4px;background:#e0f2fe;border-radius:12px;padding:4px;flex-wrap:wrap}
.tabs button{background:transparent;border-color:transparent}.tabs [aria-current=page]{background:white;color:#075985;box-shadow:0 1px 4px #17213a16}
.search{flex:1;min-width:200px;max-width:320px}.search input{width:100%}
.heading{padding:18px 20px;border-bottom:1px solid #e2e8f0}.primary{background:#075985;border-color:#075985;color:white}
.row{display:grid;grid-template-columns:1.05fr .85fr 1.25fr 1.3fr;gap:12px;align-items:center;padding:12px 20px;border-bottom:1px solid #edf0f6}
.row:last-child{border-bottom:0}.row>*{min-width:0}.row label{display:grid;gap:3px}.row input,.row select{width:100%}
[data-action=attendance]{display:block;width:100%;margin-top:3px;text-align:left}
.name{font-weight:750;overflow-wrap:anywhere}.name small{display:block;font-weight:500}
[data-tone=Present],[data-tone=Complete],.in{background:#e8f8ef;color:#126341}
[data-tone=Tardy],[data-tone=Needs\ Help]{background:#fff3d9;color:#854a05}
[data-tone=Absent]{background:#feecef;color:#9c2642}
.course-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:12px;padding:16px}
.course{padding:16px}.course .heading{padding:0;border:0}.steps{display:flex;gap:8px;margin-top:12px}.steps button{flex:1}
progress{display:block;width:100%;height:12px;margin-top:8px;accent-color:#0ea5e9}
.staff{display:grid;grid-template-columns:1.2fr 1fr auto;gap:12px;align-items:center;padding:13px 20px;border-bottom:1px solid #edf0f6}.staff:last-child{border:0}
.badge{display:inline-block;font-size:13px;border-radius:20px;padding:3px 9px;background:#e0f2fe;font-weight:700}.badge.in{background:#e8f8ef}
.empty{padding:22px}.foot{margin-top:14px}.toast{position:fixed;bottom:16px;right:16px;max-width:calc(100vw - 32px);background:#0f172a;color:white;padding:10px 16px;border-radius:12px;box-shadow:0 5px 20px #17213a33}
[hidden]{display:none!important}
@media(max-width:780px){.row{grid-template-columns:repeat(2,minmax(0,1fr))}.search{max-width:none}}
@media(max-width:420px){.row,.heading,.staff{padding-left:12px;padding-right:12px}.staff{grid-template-columns:1fr auto}.staff button{grid-column:1/-1}.tabs{width:100%}.tabs button{flex:1;padding-inline:6px;font-size:13px}.metrics{gap:6px}.metric small{font-size:11px}}

body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
form{display:flex;flex-wrap:wrap;gap:8px;align-items:end} label{display:grid;gap:3px}
.login{max-width:450px;margin:20px auto;padding:24px}.login form{display:grid}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.controls{display:grid;gap:12px}
.entry{padding:15px 20px;border-bottom:1px solid #e2e8f0}.entry:last-child{border-bottom:0}
#message{margin:12px 0;min-height:24px}.error{color:#a42642}.block{display:block}
.tabs button{flex:initial}.toolbar{justify-content:flex-start}
.row [data-action=note]{grid-column:4;justify-self:start}.hero button{color:#17213a}.hero input{min-width:0}.row input,.row select{min-width:0}
@media(max-width:780px){.row [data-action=note]{grid-column:2}}
fieldset{border:1px solid #cbd5e1;border-radius:10px;margin:0;padding:6px 10px}
.group-choice{display:flex;align-items:center;gap:5px}.group-choice input{width:22px;margin:0}
.activity-controls label{min-width:0}.activity-controls select{max-width:100%}
.activity-title{overflow-wrap:anywhere}.activity-details summary{cursor:pointer;padding:10px 0}
.activity-settings{margin-top:8px}
.hero h1{display:flex;align-items:center;gap:9px}.tabs button{display:flex;align-items:center;gap:6px}
.tabs svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6}
.badge:not(.in){background:#fef3c7;color:#0f172a;border-left:3px solid #f59e0b}
.managed-group{margin:12px 20px;border:1px solid #dbe3ee;border-radius:12px;overflow:hidden}
.group-summary,.student-summary{cursor:pointer;padding:16px;overflow-wrap:anywhere;min-height:48px}
.group-summary{background:#f0f7fc;font-size:17px}.group-summary .badge{margin-left:12px;font-size:13px}
.group-content{padding:12px 16px}.group-content h3{margin:0 0 12px}
.student-editor{border-top:1px solid #e2e8f0}.student-summary{font-size:15px}.student-summary span{margin-left:12px;color:#536078}
.student-controls{display:grid;gap:14px;padding:4px 16px 18px}.student-controls form{gap:12px}.student-controls input,.student-controls select{max-width:100%;min-width:0}
.student-controls [data-action=archive]{justify-self:start;color:#9c2642}
.group-settings{margin-top:16px;border-top:1px solid #dbe3ee;padding-top:12px}.group-settings>summary{cursor:pointer;padding:8px 0}.group-settings .controls{padding-top:12px}
@media(max-width:600px){.managed-group{margin:10px 12px}.group-content{padding:10px}.group-summary{font-size:16px}.student-controls{padding-inline:4px}.student-controls label{width:100%}.student-controls input,.student-controls select{width:100%}}
</style><script src="capacitor.js"></script><script defer src="config.js"></script><script type="module" src="app.js"></script></head>
<body><main>
<header class="hero">
  <div><span class="eyebrow">Program operations</span><h1><img src="kite.svg" width="42" height="42" alt=""> Kite</h1><p id="identity">Staff workspace</p></div>
  <div><span class="eyebrow">Today's date</span><time id="today"></time></div>
  <button id="logout" type="button" hidden>Log out</button>
</header>
<p id="message" role="status" aria-live="polite"></p>
<section id="login" class="card login">
  <h2 id="login-title">Sign in</h2><p class="muted">Use the ID and password issued by your administrator.</p>
  <form id="login-form">
    <label>User ID<input name="id" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="32"></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label>
    <button class="primary">Log in</button>
  </form>
</section>
<section id="desk" hidden>
  <div class="metrics" aria-label="Program metrics" id="metrics"></div>
  <div class="toolbar">
    <nav class="tabs" aria-label="Modules" id="tabs"></nav>
    <label>View records by date<input id="date" type="date"></label>
    <label class="search" id="search-wrap">Search students<input id="search" type="search" placeholder="Name, grade or group"></label>
  </div>
  <section class="card" id="panel" aria-label="Selected module"></section>
</section>
</main></body></html>
