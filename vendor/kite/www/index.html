<body><main>
<header class="hero">
  <div><span class="eyebrow">Program operations</span><h1><img src="kite.svg" width="42" height="42" alt=""> Kite</h1><p id="identity">Staff workspace</p></div>
  <div><span class="eyebrow">Today's date</span><time id="today"></time></div>
  <button id="logout" type="button" hidden>Log out</button>
</header>
<p id="message" role="status" aria-live="polite"></p>
<section id="login" class="card login">
  <h2 id="login-title">Sign in</h2><p class="muted">Use the ID and password issued by your administrator.</p>
  <form id="login-form">
    <label>User ID<input name="id" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="32"></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label>
    <button class="primary">Log in</button>
  </form>
</section>
<section id="desk" hidden>
  <div class="metrics" aria-label="Program metrics" id="metrics"></div>
  <div class="toolbar">
    <nav class="tabs" aria-label="Modules" id="tabs"></nav>
    <label>View records by date<input id="date" type="date"></label>
    <label class="search" id="search-wrap">Search students<input id="search" type="search" placeholder="Name, grade or group"></label>
  </div>
  <section class="card" id="panel" aria-label="Selected module"></section>
</section>
</main></body></html>
